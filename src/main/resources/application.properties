spring.application.name=estanteweb

# ------------------------------------------------------------------
# BANCO DE DADOS (MySQL)
# Usuario e senha do SEU MySQL. Troque aqui ou, sem editar o arquivo,
# defina as variaveis de ambiente DB_USER e DB_PASSWORD.
# O banco "estanteweb" e criado automaticamente na primeira execucao.
# ------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/estanteweb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:estanteweb}

spring.freemarker.expose-session-attributes=true
